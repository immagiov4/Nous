<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Lumina | Deep Reading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              paper: {
                light: '#FDFBF7',
                dark: '#18181b', // Zinc 950 - Soft Dark
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      :root {
        --font-serif: 'Merriweather', serif;
        --font-sans: 'Inter', sans-serif;
        --bg-paper: #FDFBF7;
        --ink-primary: #1F1F1F;
        --ink-secondary: #4A4A4A;
        --accent: #D97757;
      }
      
      .dark {
        --bg-paper: #18181b; /* Soft Dark */
        --ink-primary: #e4e4e7; /* Zinc 200 */
        --ink-secondary: #a1a1aa; /* Zinc 400 */
        --accent: #fb923c; /* Orange 400 */
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: auto; /* Allow scrolling */
      }
      
      #root {
        min-height: 100vh;
      }
      body {
        background-color: var(--bg-paper);
        color: var(--ink-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .font-serif { font-family: var(--font-serif); }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d8;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3f3f46;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1aa;
      }

      /* Markdown Styles */
      .prose h1, .prose h2, .prose h3 {
        font-family: var(--font-sans);
        letter-spacing: -0.02em;
        font-weight: 600;
        margin-top: 1.2em; /* Reduced from 1.5em */
        margin-bottom: 0.6em; /* Reduced from 0.8em */
      }
      .prose p {
        margin-bottom: 0.75em; /* Significantly reduced from 1.25em to align linear audio progress with visual height */
        line-height: 1.8; /* Increased slightly to accommodate scribble */
      }
      .prose blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 1rem;
        font-style: italic;
        color: var(--ink-secondary);
      }
      
      /* Custom Highlight Style - Clean Flat Style */
      mark {
        background-color: #fde047; /* Yellow 300 - Bright */
        color: #000;
        padding: 0.1em 0.2em;
        border-radius: 0.2em;
        font-weight: 500;
      }
      .dark mark {
        background-color: #fbbf24; /* Amber 400 */
        color: #000;
      }
      
      /* SCRIBBLE HIGHLIGHT STYLE - ONDICINE GRAPHITE
         - Smooth Bezier curves (not jagged)
         - Low positioning (y=23/30)
         - Irregular pattern to simulate hand movement
      */
      .scribble-highlight {
        background-color: transparent;
        /* 
           Long SVG (400px) to allow for non-repeating irregularity.
           Path uses Curves (C/S) instead of Lines (L) for smooth waves.
        */
        background-image: url("data:image/svg+xml,%3Csvg width='400' height='30' viewBox='0 0 400 30' xmlns='http://www.w3.org/2000/svg'%3E%3C!-- Main stroke: Darker, defined wave --%3E%3Cpath d='M2 23 C 20 25, 40 21, 60 23 S 110 25, 150 22 S 200 24, 250 23 S 300 21, 340 23 S 380 25, 400 23' stroke='%234b5563' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.8' /%3E%3C!-- Secondary stroke: Lighter, slightly offset, slightly different frequency --%3E%3Cpath d='M0 25 C 25 27, 45 23, 70 25 S 120 27, 160 24 S 210 26, 260 24 S 310 23, 350 25 S 390 27, 400 25' stroke='%234b5563' stroke-width='1' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.4' /%3E%3C/svg%3E");
        
        background-repeat: repeat-x;
        background-position: 0 100%; /* Bottom aligned */
        background-size: 200px 15px; /* Height restricted to bottom 15px of line */
        
        padding-bottom: 1px;
        
        text-decoration: none;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        color: inherit;
      }
      
      .dark .scribble-highlight {
        /* Lighter graphite for dark mode */
        background-image: url("data:image/svg+xml,%3Csvg width='400' height='30' viewBox='0 0 400 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 23 C 20 25, 40 21, 60 23 S 110 25, 150 22 S 200 24, 250 23 S 300 21, 340 23 S 380 25, 400 23' stroke='%23d4d4d8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' /%3E%3Cpath d='M0 25 C 25 27, 45 23, 70 25 S 120 27, 160 24 S 210 26, 260 24 S 310 23, 350 25 S 390 27, 400 25' stroke='%23d4d4d8' stroke-width='1' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.5' /%3E%3C/svg%3E");
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when libraries (like formdata-polyfill) try to overwrite window.fetch
      (function() {
        try {
          let currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { 
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore errors during patching
        }
      })();

      // Polyfill process and global for browser environment
      window.global = window;
      window.process = {
        env: {
          NODE_ENV: 'development'
        }
      };
    </script>

{
  "imports": {

}
</script>

</html>
