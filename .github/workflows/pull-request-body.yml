name: Pull request body

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate remote Markdown body
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read body from pull request event
        env:
          BODY_FILE: ${{ runner.temp }}/pull-request-body.md
        run: >-
          node -e "const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          fs.writeFileSync(process.env.BODY_FILE, event.pull_request.body ?? '', 'utf8');"

      - name: Verify remote pull request body
        env:
          BODY_FILE: ${{ runner.temp }}/pull-request-body.md
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/github-body.mjs verify --kind pr --repo "$REPOSITORY"
          --number "$PR_NUMBER" --body-file "$BODY_FILE"
