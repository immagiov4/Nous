name: '🔎 Gemini PR Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Run Gemini pull request review'
        uses: 'The-PR-Agent/pr-agent@6ad7cf75d95cb3bbb54cf2ad92050eb03804964a' # v0.40.0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          config.model: 'gemini/gemini-3.6-flash'
          config.fallback_models: '["gemini/gemini-3.6-flash"]'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened", "synchronize"]'
