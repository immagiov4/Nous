name: Requirements hook
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  requirements-hook:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
      - name: Test installation and hook behavior
        run: python -m unittest discover -s .agents/skills/requirements-blast-radius/scripts -p "test_*.py"
