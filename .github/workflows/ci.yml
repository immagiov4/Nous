name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Run Quality Checks (TypeScript + Biome)
        run: npm run quality

      - name: Run Fallow Static Analysis (regression check)
        run: npm run check:fallow:ci

      - name: Run Test Suite
        run: npm test

      - name: Run Coverage
        run: npm run test:coverage
