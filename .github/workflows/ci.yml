name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede the entire PR graph together so a stale fan-in cannot cancel its replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build production backend with separate aeneas process
        run: docker build --target backend .

  test:
    runs-on: ubuntu-latest
    needs: [quality-coverage, browser-proofs]
    if: always()

    steps:
      - name: Require quality coverage and browser proofs
        env:
          QUALITY_RESULT: ${{ needs.quality-coverage.result }}
          BROWSER_RESULT: ${{ needs.browser-proofs.result }}
        shell: node {0}
        run: |
          console.log(`quality-coverage: ${process.env.QUALITY_RESULT}`);
          console.log(`browser-proofs: ${process.env.BROWSER_RESULT}`);
          process.exit(process.env.QUALITY_RESULT === 'success' && process.env.BROWSER_RESULT === 'success' ? 0 : 1);

  static-checks:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-static-checks
      cancel-in-progress: true

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - &setup-node
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &install-dependencies
        name: Install Dependencies
        run: bun install --frozen-lockfile


      - name: Run static quality and Fallow checks
        run: bun run gate:checks

      - name: Upload React Hooks report for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: .temp/sonar/eslint-report.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  vitest-coverage-shard:
    runs-on: ubuntu-latest
    outputs:
      shard-count: ${{ steps.vitest.outputs.shard-count }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-vitest-${{ matrix.shard }}
      cancel-in-progress: true

    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *install-dependencies

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Vitest with Node coverage
        id: vitest
        env:
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          node scripts/prepare-node-coverage.mjs
          node node_modules/vitest/vitest.mjs run --config apps/web/vitest.config.ts --coverage \
            --shard="${{ matrix.shard }}/$SHARD_COUNT" --reporter=default --reporter=github-actions --reporter=blob \
            --outputFile="vitest-shard-${{ matrix.shard }}.json"
          echo "shard-count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Vitest blob
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: vitest-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true

  python-coverage:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-python-coverage
      cancel-in-progress: true

    steps:
      - *checkout

      - name: Set up Python for source-shelf verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source-shelf generator and measure Python coverage
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python3 -m pip install --target "$RUNNER_TEMP/source-shelf-python" coverage==7.6.1 numpy==2.5.4 pillow==13.0.0
          archive="$RUNNER_TEMP/blender.tar.xz"
          for mirror in https://mirror.clarkson.edu/blender https://ftp.nluug.nl/graphics/blender; do
            echo "Downloading Blender from $mirror"
            if curl --fail --location --silent --show-error --max-time 120 "$mirror/release/Blender3.0/blender-3.0.0-linux-x64.tar.xz" -o "$archive" &&
              echo "19b09dfcf5d3f3a068827454f0a704a9aa9c826350f73016121afef5f4d287ce  $archive" | sha256sum --check; then
              break
            fi
            rm -f "$archive"
          done
          test -f "$archive"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/source-shelf-python"
          "$RUNNER_TEMP/blender-3.0.0-linux-x64/blender" -b --python-exit-code 1 --python scripts/source-shelf/tests/coverage_blender.py -- check blue
          python3 scripts/source-shelf/tests/coverage_encoder.py

      - name: Upload Python reports for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            scripts/source-shelf/coverage-blender.xml
            scripts/source-shelf/coverage-encoder.xml
          if-no-files-found: error
          overwrite: true

  quality-coverage:
    runs-on: ubuntu-latest
    needs: [static-checks, vitest-coverage-shard, python-coverage]
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful Vitest shards
        if: needs.vitest-coverage-shard.result != 'success'
        env:
          VITEST_RESULT: ${{ needs.vitest-coverage-shard.result }}
        run: |
          echo "::error::Vitest coverage shards ended with $VITEST_RESULT"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - *setup-node
      - *setup-bun
      - *install-dependencies

      - name: Download Vitest blobs
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: vitest-reports
          merge-multiple: true

      - name: Merge Vitest reports and coverage
        id: merge
        env:
          SHARD_COUNT: ${{ needs.vitest-coverage-shard.outputs.shard-count }}
        run: |
          shopt -s nullglob
          blobs=(vitest-reports/vitest-shard-*.json)
          if [[ ! "$SHARD_COUNT" =~ ^[1-9][0-9]*$ || "${#blobs[@]}" != "$SHARD_COUNT" ]]; then
            echo "::error::Expected ${SHARD_COUNT:-an unknown number of} Vitest blobs, found ${#blobs[@]}"
            exit 1
          fi
          node scripts/prepare-node-coverage.mjs
          node node_modules/vitest/vitest.mjs --config apps/web/vitest.config.ts \
            --merge-reports vitest-reports --coverage --coverage.reporter=lcovonly --coverage.reporter=text-summary

      - name: Require static checks and Python coverage
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          PYTHON_RESULT: ${{ needs.python-coverage.result }}
        shell: node {0}
        run: |
          const results = {
            'static-checks': process.env.STATIC_RESULT,
            'python-coverage': process.env.PYTHON_RESULT,
          };
          console.log(results);
          process.exit(Object.values(results).every(result => result === 'success') ? 0 : 1);

      - name: Download React Hooks report
        uses: actions/download-artifact@v4
        with:
          name: eslint-report
          path: .temp/sonar

      - name: Download Python coverage reports
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: scripts/source-shelf

      - name: Require SonarCloud report inputs
        run: |
          for report in coverage/lcov.info .temp/sonar/eslint-report.json \
            scripts/source-shelf/coverage-blender.xml scripts/source-shelf/coverage-encoder.xml; do
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing or empty SonarCloud report: $report"
              exit 1
            fi
          done

      - name: SonarQube Cloud scan and quality gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # project.settings cannot be combined with the action's default sonar.projectBaseDir.
          projectBaseDir: ''
          args: >-
            -Dproject.settings=config/sonar-project.properties
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.eslint.reportPaths=.temp/sonar/eslint-report.json

      - name: Upload coverage for parity comparison
        if: always() && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/lcov.info
          overwrite: true
          if-no-files-found: error

  browser-proofs:
    runs-on: ubuntu-latest
    needs: [playback-proofs, source-preparation-proofs]
    if: always()

    steps:
      - name: Require both browser proof groups
        env:
          PLAYBACK_RESULT: ${{ needs.playback-proofs.result }}
          SOURCE_PREPARATION_RESULT: ${{ needs.source-preparation-proofs.result }}
        shell: node {0}
        run: |
          const { PLAYBACK_RESULT, SOURCE_PREPARATION_RESULT } = process.env;
          console.log(`playback-proofs: ${PLAYBACK_RESULT}`);
          console.log(`source-preparation-proofs: ${SOURCE_PREPARATION_RESULT}`);
          process.exit(PLAYBACK_RESULT === 'success' && SOURCE_PREPARATION_RESULT === 'success' ? 0 : 1);

  playback-proofs:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-playback-proofs
      cancel-in-progress: true

    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *install-dependencies

      - &install-browsers
        name: Install Chromium and Firefox
        run: bunx playwright install --with-deps chromium firefox

      - name: Verify production audio in Chromium and Firefox
        run: |
          sudo apt-get install --yes pulseaudio
          pulseaudio --start
          trap 'pulseaudio --kill || true' EXIT
          pactl load-module module-null-sink sink_name=nous_playback
          pactl set-default-sink nous_playback
          bun run test:audio-production

      - name: Verify complete caption rows
        run: bun run test:caption-rows

      - name: Verify guided-step badge alignment
        run: bun --tsconfig-override e2e/nous/tsconfig.json apps/web/tests/components/shared/GuidedStepAlignment.browser.tsx

      - name: Verify playback bar layout
        run: bun scripts/heavy-run.mjs --label playback-bar -- node apps/web/tests/components/workspace/PlaybackBarLayout.browser.ts

      - name: Verify playback keyboard focus in Chromium and Firefox
        run: node apps/web/tests/components/workspace/PlaybackFocus.browser.ts

      - name: Verify interview draft recovery through the library
        env:
          NOUS_E2E_DATA: ${{ runner.temp }}/nous-recovery
        run: bun run test:interview-recovery

      - name: Upload interview recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-recovery
          path: ${{ runner.temp }}/nous-recovery/interview-recovery
          overwrite: true
          if-no-files-found: ignore

  source-preparation-proofs:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-source-preparation-proofs
      cancel-in-progress: true

    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *install-dependencies
      - *install-browsers

      - name: Verify source-preparation motion and lifecycle
        env:
          NOUS_E2E_DATA: ${{ runner.temp }}/nous-source-preparation
        run: bun run test:source-preparation-shelf

      - name: Verify source-preparation playback in Firefox
        env:
          NOUS_E2E_DATA: ${{ runner.temp }}/nous-source-preparation-firefox
          SHELF_BROWSER: firefox
          SHELF_SCENE: desktop-light
        run: bun run test:source-preparation-shelf

      - name: Upload source-preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-preparation
          path: |
            ${{ runner.temp }}/nous-source-preparation/source-preparation-shelf
            ${{ runner.temp }}/nous-source-preparation-firefox/source-preparation-shelf
          overwrite: true
          if-no-files-found: ignore

  supabase-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-supabase
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate Supabase image pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Local Supabase
        env:
          SUPABASE_AUTH_SMTP_PASS: ci-placeholder-not-used
        run: bunx supabase start

      - name: Run Canonical Auth/RLS Contract
        run: bun run test:supabase-contract

      - name: Select Workflow PostgreSQL Contract
        id: workflow-postgres
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" | \
            bun run scripts/select-workflow-postgres-contract.ts

      - name: Run Critical Workflow PostgreSQL Contract
        if: github.event_name == 'pull_request' && steps.workflow-postgres.outputs.changed == 'true'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres:critical

      - name: Run Full Workflow PostgreSQL Contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres

      - name: Stop Local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  managed-staging-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-managed-staging
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_STAGING_JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}

    steps:
      - name: Checkout
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun install --frozen-lockfile

      - name: Run Canonical Contract Against Managed Staging
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun run test:supabase-contract
