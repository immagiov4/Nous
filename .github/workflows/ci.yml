name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Quality Checks (TypeScript + Biome)
        run: bun run quality

      - name: Run Fallow Static Analysis (regression check)
        run: bun run check:fallow:ci

      - name: Run Test Suite
        run: bun run test

      - name: Run Coverage
        run: bun run test:coverage

  supabase-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Start Local Supabase
        env:
          SUPABASE_AUTH_SMTP_PASS: ci-placeholder-not-used
        run: bunx supabase start

      - name: Run Canonical Auth/RLS Contract
        run: bun run test:supabase-contract

      - name: Select Workflow PostgreSQL Contract
        id: workflow-postgres
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" | \
            bun run scripts/select-workflow-postgres-contract.ts

      - name: Run Critical Workflow PostgreSQL Contract
        if: github.event_name == 'pull_request' && steps.workflow-postgres.outputs.changed == 'true'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres:critical

      - name: Run Full Workflow PostgreSQL Contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres

      - name: Stop Local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  managed-staging-contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_STAGING_JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun install --frozen-lockfile

      - name: Run Canonical Contract Against Managed Staging
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun run test:supabase-contract
