name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docker-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build shared production dependencies
        run: docker build --target dependencies .

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-test
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium and Firefox
        run: bunx playwright install --with-deps chromium firefox

      - name: Verify production audio in Chromium and Firefox
        run: |
          sudo apt-get install --yes pulseaudio
          pulseaudio --start
          trap 'pulseaudio --kill || true' EXIT
          pactl load-module module-null-sink sink_name=nous_playback
          pactl set-default-sink nous_playback
          bun run test:audio-production

      - name: Run CI Gate
        run: bun run gate:ci

      - name: SonarQube Cloud scan and quality gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # project.settings cannot be combined with the action's default sonar.projectBaseDir.
          projectBaseDir: ''
          args: >-
            -Dproject.settings=config/sonar-project.properties
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.eslint.reportPaths=.temp/sonar/eslint-report.json

      - name: Upload coverage for parity comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error

  supabase-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-supabase
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate Supabase image pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Local Supabase
        env:
          SUPABASE_AUTH_SMTP_PASS: ci-placeholder-not-used
        run: bunx supabase start

      - name: Run Canonical Auth/RLS Contract
        run: bun run test:supabase-contract

      - name: Select Workflow PostgreSQL Contract
        id: workflow-postgres
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" | \
            bun run scripts/select-workflow-postgres-contract.ts

      - name: Run Critical Workflow PostgreSQL Contract
        if: github.event_name == 'pull_request' && steps.workflow-postgres.outputs.changed == 'true'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres:critical

      - name: Run Full Workflow PostgreSQL Contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          eval "$(bunx supabase status -o env)"
          WORKFLOW_INTEGRATION_DATABASE_URL="$DB_URL" bun run test:workflow-postgres

      - name: Stop Local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  managed-staging-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-managed-staging
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_STAGING_JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}

    steps:
      - name: Checkout
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun install --frozen-lockfile

      - name: Run Canonical Contract Against Managed Staging
        if: env.DATABASE_URL != '' && env.SUPABASE_JWT_SECRET != '' && env.SUPABASE_URL != ''
        run: bun run test:supabase-contract
