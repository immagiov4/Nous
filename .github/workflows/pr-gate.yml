name: PR sections
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  sections:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: project
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fetch pinned Geppetto package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: immagiov4/Geppetto
          ref: 81079d44b762b28f00402fecf46684954bb0a759
          path: geppetto
          persist-credentials: false
      - name: Check required sections
        working-directory: project
        run: node ../geppetto/skills/geppetto-adopt/scripts/pr-event.mjs
      - name: Check changed feature documents
        working-directory: project
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../geppetto/skills/geppetto-adopt/scripts/pr-event.mjs --docs
