name: lumina-reader

services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: lumina-sonarqube
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
      SONAR_FORCEAUTHENTICATION: 'false'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: 'no'

  sonar-permissions:
    image: curlimages/curl:8.21.0
    depends_on:
      sonarqube:
        condition: service_started
    entrypoint: ['/bin/sh', '-ec']
    environment:
      SONAR_PROVISIONING_ADMIN_LOGIN: ${SONAR_PROVISIONING_ADMIN_LOGIN:-admin}
      SONAR_PROVISIONING_ADMIN_PASSWORD: ${SONAR_PROVISIONING_ADMIN_PASSWORD:-admin}
      SONAR_READINESS_POLL_SECONDS: '1'
      SONAR_READINESS_TIMEOUT_SECONDS: '133'
    command:
      - |
        SONAR_READINESS_DEADLINE="$$(($$(date +%s) + $${SONAR_READINESS_TIMEOUT_SECONDS}))"
        while true; do
          SONAR_STATUS="$$(curl --fail --silent --max-time "$${SONAR_READINESS_POLL_SECONDS}" http://sonarqube:9000/api/system/status || true)"
          if printf '%s' "$$SONAR_STATUS" | grep -Fq '"status":"UP"'; then
            break
          fi
          if printf '%s' "$$SONAR_STATUS" | grep -Fq '"status":"DB_MIGRATION_NEEDED"'; then
            printf '%s\n' 'SonarQube requires a database migration before local analysis can run.' >&2
            exit 1
          fi
          if [ "$$(date +%s)" -ge "$$SONAR_READINESS_DEADLINE" ]; then
            printf 'SonarQube did not reach UP within %s seconds.\n' \
              "$${SONAR_READINESS_TIMEOUT_SECONDS}" >&2
            exit 1
          fi
          sleep "$${SONAR_READINESS_POLL_SECONDS}"
        done
        SONAR_PROVISIONING_CREDENTIALS="$${SONAR_PROVISIONING_ADMIN_LOGIN}:$${SONAR_PROVISIONING_ADMIN_PASSWORD}"
        if ! curl --fail --silent --show-error --user "$$SONAR_PROVISIONING_CREDENTIALS" \
          http://sonarqube:9000/api/authentication/validate | grep -F '"valid":true' > /dev/null; then
          SONAR_PROVISIONING_CREDENTIALS='admin:admin'
        fi
        curl --fail --silent --show-error --user "$$SONAR_PROVISIONING_CREDENTIALS" \
          http://sonarqube:9000/api/system/status | grep -F '"status":"UP"' > /dev/null
        curl --fail --silent --show-error --user "$$SONAR_PROVISIONING_CREDENTIALS" --request POST \
          --data-urlencode 'groupName=Anyone' \
          --data-urlencode 'permission=provisioning' \
          http://sonarqube:9000/api/permissions/add_group
        curl --fail --silent --show-error --user "$$SONAR_PROVISIONING_CREDENTIALS" --request POST \
          --data-urlencode 'groupName=Anyone' \
          --data-urlencode 'permission=scan' \
          http://sonarqube:9000/api/permissions/add_group

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
