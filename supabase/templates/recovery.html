<!doctype html>
<html lang="it">
  <body style="font-family: Georgia, serif; color: #171717; background: #f8f7f4; padding: 24px;">
    <main style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e7e2d9; border-radius: 12px; padding: 28px;">
      <img src="https://nous.giovbox.com/icons/nous-app-icon-192.png" alt="Nous" width="64" height="64" style="display: block; border: 0; border-radius: 14px; margin: 0 0 24px;" />
      <h1 style="font-size: 24px; margin: 0 0 12px;">Reimposta la password Nous</h1>
      <p style="font-family: Arial, sans-serif; line-height: 1.6;">Il pulsante apre la schermata dove scegliere una nuova password per il tuo account.</p>
      <p style="font-family: Arial, sans-serif; line-height: 1.6;">La password attuale non cambia finché non confermi quella nuova in Nous.</p>
      <p style="margin: 24px 0;">
        <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #171717; color: #ffffff; padding: 12px 18px; border-radius: 999px; text-decoration: none; font-family: Arial, sans-serif;">Scegli una nuova password</a>
      </p>
      <p style="font-family: Arial, sans-serif; color: #666; font-size: 13px; line-height: 1.5;">Il link è personale e monouso. Se non hai chiesto il recupero, puoi ignorare l'email.</p>
    </main>
  </body>
</html>
