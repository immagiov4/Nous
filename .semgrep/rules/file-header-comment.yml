rules:
  - id: js-ts-file-header-comment
    message: Add a short file header comment that explains the file's responsibility.
    severity: LOW
    languages:
      - generic
    paths:
      include:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      exclude:
        - "**/*.d.ts"
        - "**/dist/**"
        - "**/node_modules/**"
        - "**/graphify-out/**"
    patterns:
      - pattern-regex: |-
          (?s)\A[\s\S]+
      - pattern-not-regex: |-
          \A\s*(?://[^\n]+(?:\n\s*//[^\n]+)*\n|/\*[\s\S]*?\*/\s*)
