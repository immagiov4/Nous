<!doctype html>
<html lang="en">
<title>Following Slider fixture</title>
<style>
  #track { position: absolute; left: 100px; top: 100px; width: 300px; height: 20px; }
  #thumb { position: absolute; left: 0; width: 20px; height: 20px; background: black; }
</style>
<body>
  <!-- A custom-control fixture exercises pointer tracking beyond native input controls. -->
  <div id="track"><div id="thumb" role="slider" tabindex="0" aria-label="Value" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
  <script>
    const thumb = document.querySelector('#thumb');
    let pressX;
    let originLeft;
    thumb.addEventListener('pointerdown', event => {
      pressX = event.clientX;
      originLeft = thumb.offsetLeft;
      thumb.setPointerCapture(event.pointerId);
    });
    thumb.addEventListener('pointermove', event => {
      if (event.buttons) thumb.style.left = `${originLeft + event.clientX - pressX}px`;
    });
  </script>
</body>
</html>
