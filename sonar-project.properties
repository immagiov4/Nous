sonar.projectKey=lumina-reader
sonar.projectName=Lumina Reader
sonar.sourceEncoding=UTF-8
sonar.sources=apps/web,apps/backend,packages,scripts
sonar.tests=apps/web/tests,apps/backend/tests,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,graphify-out/**,.codex/**,.claude/**,.dyad/**,**/*.d.ts,**/*.png,**/*.mp4
sonar.coverage.exclusions=scripts/run-real-workflow-provider-tests.ts
sonar.typescript.tsconfigPaths=tsconfig.json,apps/web/tsconfig.json,apps/backend/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Remotion tooling intentionally keeps its frame timeline and fixture state colocated.
# Product UI complexity remains actionable; only this deterministic render composition is exempt.
sonar.issue.ignore.multicriteria=remotion-frame-complexity,playback-stage-cascade
sonar.issue.ignore.multicriteria.remotion-frame-complexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.remotion-frame-complexity.resourceKey=apps/web/components/marketing/LandingProductComposition.tsx
# The lesson player stage is a one-to-one port of the notes-live-lab stylesheet, whose later
# sections intentionally restate selectors to override earlier ones; merging them would change
# the cascade the prototype defines.
sonar.issue.ignore.multicriteria.playback-stage-cascade.ruleKey=css:S4666
sonar.issue.ignore.multicriteria.playback-stage-cascade.resourceKey=apps/web/components/workspace/playback/stage.css
